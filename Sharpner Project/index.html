<body>
    <div>
        <h1 id="heading">Expenses Tracker</h1>

        <input type="text" placeholder="Enter Description" id="ip_desc"/>
        </div>

          <div class="form_group">
        <label for="ip_cat">Choose category :</label>
       <select id="ip_cat">
  <option>
    Select
  </option>
  <option> Movies</option>
  <option> Clothes</option>
  <option>Studies</option>
  <option>Groceries</option>
       </select>
        </div>
        <div class="form_group">
                 <button type="submit" id="btn">Add Expense</button>
        </div>
      </form>



      </div>
<div id="result_parent">
